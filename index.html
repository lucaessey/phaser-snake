<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#388e3c" />
    <meta name="description" content="Play Snake with touch controls, AI rivals, and custom skins, online or offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snake" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/snake-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>Snake</title>
</head>
<body>
    <div id="app"><div id="game-container"></div></div>
    <div id="pwa-tools" class="scene-hidden">
        <span id="offline-status" role="status"></span>
        <button id="install-button">Install game</button>
    </div>
    <aside id="update-notice" role="status" hidden>
        <p>An update is ready. Updating starts a new game.</p>
        <button id="update-button">Update now</button>
        <button id="dismiss-update">Later</button>
    </aside>
    <dialog id="install-guide" aria-labelledby="install-guide-title" aria-describedby="install-guide-note">
        <h2 id="install-guide-title">Install Snake</h2>
        <ol id="install-guide-steps"></ol>
        <p id="install-guide-note"></p>
        <button id="install-guide-close" autofocus>Got it</button>
    </dialog>
    <noscript>Enable JavaScript to play Snake.</noscript>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
